name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mailto:
        description: Contact email for the OpenAlex polite pool (optional)
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node bench/parity.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The benchmark hits a live API and is therefore opt-in: run it manually from
  # Actions -> ci -> Run workflow, and pass a contact address for the polite pool.
  bench:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bench/run.mjs --mailto "${{ inputs.mailto }}"
